[mod-description]
logistic-bot-tiers=Tiered logistic and construction robots, parallel to transport belt tiers. Fast, express, turbo, advanced, and superior bots with scaled speed, cargo, energy storage, and efficiency. All tier multipliers are configurable via mod settings. Each tier recipe consumes the previous tier, mirroring the belt upgrade chain.

