[mod-setting-description]
lbt-fast-speed-mult=Speed multiplier for fast-tier bots relative to vanilla. Default: 1.5
lbt-fast-cargo-add=Additional cargo slots for fast-tier bots. Default: 1
lbt-fast-energy-mult=Energy storage multiplier for fast-tier bots. Default: 1.5
lbt-fast-energy-eff=Energy consumption multiplier for fast-tier bots (lower = more efficient). Default: 0.80
lbt-fast-health-mult=Health multiplier for fast-tier bots. Default: 1.5
lbt-express-speed-mult=Speed multiplier for express-tier bots relative to vanilla. Default: 2.0
lbt-express-cargo-add=Additional cargo slots for express-tier bots. Default: 2
lbt-express-energy-mult=Energy storage multiplier for express-tier bots. Default: 2.0
lbt-express-energy-eff=Energy consumption multiplier for express-tier bots (lower = more efficient). Default: 0.65
lbt-express-health-mult=Health multiplier for express-tier bots. Default: 2.0
lbt-turbo-speed-mult=Speed multiplier for turbo-tier bots relative to vanilla. Default: 2.5
lbt-turbo-cargo-add=Additional cargo slots for turbo-tier bots. Default: 3
lbt-turbo-energy-mult=Energy storage multiplier for turbo-tier bots. Default: 2.5
lbt-turbo-energy-eff=Energy consumption multiplier for turbo-tier bots (lower = more efficient). Default: 0.50
lbt-turbo-health-mult=Health multiplier for turbo-tier bots. Default: 2.5
lbt-advanced-speed-mult=Speed multiplier for advanced-tier bots relative to vanilla. Default: 2.5
lbt-advanced-cargo-add=Additional cargo slots for advanced-tier bots. Default: 3
lbt-advanced-energy-mult=Energy storage multiplier for advanced-tier bots. Default: 2.5
lbt-advanced-energy-eff=Energy consumption multiplier for advanced-tier bots (lower = more efficient). Default: 0.50
lbt-advanced-health-mult=Health multiplier for advanced-tier bots. Default: 2.5
lbt-superior-speed-mult=Speed multiplier for superior-tier bots relative to vanilla. Default: 3.0
lbt-superior-cargo-add=Additional cargo slots for superior-tier bots. Default: 4
lbt-superior-energy-mult=Energy storage multiplier for superior-tier bots. Default: 3.0
lbt-superior-energy-eff=Energy consumption multiplier for superior-tier bots (lower = more efficient). Default: 0.35
lbt-superior-health-mult=Health multiplier for superior-tier bots. Default: 3.0
